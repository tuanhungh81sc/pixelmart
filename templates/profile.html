{% extends "base.html" %}
{% block title %}Tài khoản - PixelMart{% endblock %}
{% block content %}

<h1 class="page-title">Tài khoản của tôi</h1>

<div class="profile-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
  <div class="card">
    <h2 style="font-size:15px; margin-top:0; margin-bottom:16px;">Thông tin cá nhân</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST" action="/profile">
      <label class="field-label">Tên đăng nhập</label>
      <input type="text" value="{{ user.username }}" disabled class="field-input">

      <label class="field-label">Họ và tên</label>
      <input type="text" name="full_name" value="{{ user.full_name }}" class="field-input">

      <label class="field-label">Email</label>
      <input type="email" name="email" value="{{ user.email }}" required class="field-input">

      <label class="field-label">Địa chỉ giao hàng</label>
      <textarea name="address" rows="2" class="field-input" style="resize:vertical;">{{ user.address }}</textarea>

      <button type="submit" class="btn btn-primary">
        Lưu thay đổi
      </button>
    </form>
  </div>

  <div class="card" style="align-self:start;">
    <h2 style="font-size:15px; margin-top:0; margin-bottom:16px;">Đổi mật khẩu</h2>
    <form method="POST" action="/profile/password">
      <label class="field-label">Mật khẩu hiện tại</label>
      <input type="password" name="current_password" required class="field-input">

      <label class="field-label">Mật khẩu mới (tối thiểu 8 ký tự)</label>
      <input type="password" name="new_password" required minlength="8" class="field-input">

      <button type="submit" class="btn btn-ghost">
        Đổi mật khẩu
      </button>
    </form>
  </div>
</div>

{% endblock %}
