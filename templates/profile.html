{% extends "base.html" %}
{% block title %}Tài khoản - PixelMart{% endblock %}
{% block content %}

<h1 style="font-size:22px; margin-bottom:20px;">Tài khoản của tôi</h1>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
  <div style="background:#1a1d24; border-radius:10px; padding:20px;">
    <h2 style="font-size:15px; margin-top:0; margin-bottom:16px;">Thông tin cá nhân</h2>
    {% if error %}<div style="color:#ff6b6b; font-size:13px; margin-bottom:12px;">{{ error }}</div>{% endif %}
    <form method="POST" action="/profile">
      <label style="font-size:12px; color:#999;">Tên đăng nhập</label>
      <input type="text" value="{{ user.username }}" disabled
             style="width:100%; padding:9px; margin:6px 0 14px; border-radius:6px; border:1px solid #2a2e38; background:#14161b; color:#777;">

      <label style="font-size:12px; color:#999;">Họ và tên</label>
      <input type="text" name="full_name" value="{{ user.full_name }}"
             style="width:100%; padding:9px; margin:6px 0 14px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#fff;">

      <label style="font-size:12px; color:#999;">Email</label>
      <input type="email" name="email" value="{{ user.email }}" required
             style="width:100%; padding:9px; margin:6px 0 14px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#fff;">

      <label style="font-size:12px; color:#999;">Địa chỉ giao hàng</label>
      <textarea name="address" rows="2"
                style="width:100%; padding:9px; margin:6px 0 14px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#fff; resize:vertical;">{{ user.address }}</textarea>

      <button type="submit" style="padding:9px 18px; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:bold; cursor:pointer;">
        Lưu thay đổi
      </button>
    </form>
  </div>

  <div style="background:#1a1d24; border-radius:10px; padding:20px; align-self:start;">
    <h2 style="font-size:15px; margin-top:0; margin-bottom:16px;">Đổi mật khẩu</h2>
    <form method="POST" action="/profile/password">
      <label style="font-size:12px; color:#999;">Mật khẩu hiện tại</label>
      <input type="password" name="current_password" required
             style="width:100%; padding:9px; margin:6px 0 14px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#fff;">

      <label style="font-size:12px; color:#999;">Mật khẩu mới (tối thiểu 8 ký tự)</label>
      <input type="password" name="new_password" required minlength="8"
             style="width:100%; padding:9px; margin:6px 0 14px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#fff;">

      <button type="submit" style="padding:9px 18px; border:none; border-radius:6px; background:#2a2e38; color:#fff; cursor:pointer;">
        Đổi mật khẩu
      </button>
    </form>
  </div>
</div>

{% endblock %}
