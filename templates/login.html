<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>PixelMart - Đăng nhập</title>
<style>
  body { font-family: Arial, sans-serif; background:#0f1115; color:#e6e6e6; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { background:#1a1d24; padding:32px; border-radius:12px; width:320px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:22px; margin-bottom:4px; }
  p.sub { color:#999; font-size:13px; margin-top:0; margin-bottom:20px; }
  input { width:100%; padding:10px; margin-bottom:12px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#fff; box-sizing:border-box; }
  button { width:100%; padding:10px; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:bold; cursor:pointer; }
  .error { color:#ff6b6b; font-size:13px; margin-bottom:12px; }
  .hint { margin-top:16px; font-size:12px; color:#777; line-height:1.5; }
  .hint code { background:#0f1115; padding:2px 5px; border-radius:4px; }
</style>
</head>
<body>
  <div class="box">
    <h1>🛒 PixelMart</h1>
    <p class="sub">Lab nội bộ - chỉ dùng để học tập</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Tài khoản" required>
      <input type="password" name="password" placeholder="Mật khẩu" required>
      <button type="submit">Đăng nhập</button>
    </form>
    <div class="hint">
      Tài khoản demo: <code>tester</code> / <code>Password123!</code>
    </div>
  </div>
</body>
</html>
