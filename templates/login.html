{% extends "base.html" %}
{% block title %}Đăng nhập - PixelMart{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Đăng nhập</h1>
    <p class="sub">Lab nội bộ - chỉ dùng để học tập</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Tài khoản" required class="field-input">
      <input type="password" name="password" placeholder="Mật khẩu" required class="field-input">
      <button type="submit" class="btn btn-primary btn-block">
        Đăng nhập
      </button>
    </form>
    <div class="auth-hint">
      Tài khoản demo: <code>tester</code> /
      <code>Password123!</code>
    </div>
    <div class="auth-switch">
      Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
    </div>
  </div>
</div>
{% endblock %}
