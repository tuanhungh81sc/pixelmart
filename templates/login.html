{% extends "base.html" %}
{% block title %}Đăng nhập - PixelMart{% endblock %}
{% block content %}
<div style="max-width:360px;margin:40px auto;background:#1a1d24;padding:32px;border-radius:12px;">
  <h1 style="font-size:22px;margin-bottom:4px;">Đăng nhập</h1>
  <p style="color:#999;font-size:13px;margin-top:0;margin-bottom:20px;">Lab nội bộ - chỉ dùng để học tập</p>
  {% if error %}<div style="color:#ff6b6b;font-size:13px;margin-bottom:12px;">{{ error }}</div>{% endif %}
  <form method="POST" action="/login">
    <input type="text" name="username" placeholder="Tài khoản" required
           style="width:100%;padding:10px;margin-bottom:12px;border-radius:6px;border:1px solid #333;background:#0f1115;color:#fff;">
    <input type="password" name="password" placeholder="Mật khẩu" required
           style="width:100%;padding:10px;margin-bottom:12px;border-radius:6px;border:1px solid #333;background:#0f1115;color:#fff;">
    <button type="submit"
            style="width:100%;padding:10px;border:none;border-radius:6px;background:#4f7cff;color:#fff;font-weight:bold;cursor:pointer;">
      Đăng nhập
    </button>
  </form>
  <div style="margin-top:16px;font-size:12px;color:#777;line-height:1.5;">
    Tài khoản demo: <code style="background:#0f1115;padding:2px 5px;border-radius:4px;">tester</code> /
    <code style="background:#0f1115;padding:2px 5px;border-radius:4px;">Password123!</code>
  </div>
  <div style="margin-top:10px;font-size:13px;">
    Chưa có tài khoản? <a href="/register" style="color:#4f7cff;">Đăng ký ngay</a>
  </div>
</div>
{% endblock %}
