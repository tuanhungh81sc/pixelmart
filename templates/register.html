{% extends "base.html" %}
{% block title %}Đăng ký - PixelMart{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width:400px;">
  <div class="card">
    <h1>Tạo tài khoản mới</h1>
    <p class="sub">Miễn phí, chỉ mất 30 giây</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST" action="/register">
      <input type="text" name="username" placeholder="Tên đăng nhập (3-30 ký tự)" required minlength="3" maxlength="30" class="field-input">
      <input type="email" name="email" placeholder="Email" required class="field-input">
      <input type="text" name="full_name" placeholder="Họ và tên" class="field-input">
      <input type="password" name="password" placeholder="Mật khẩu (tối thiểu 8 ký tự)" required minlength="8" class="field-input">
      <button type="submit" class="btn btn-primary btn-block">
        Đăng ký
      </button>
    </form>
    <div class="auth-switch">
      Đã có tài khoản? <a href="/login">Đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
