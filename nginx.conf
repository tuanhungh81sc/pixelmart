# Nginx reverse proxy cho PixelMart Lab.
#
# Day la "cua chinh" du dinh cua ung dung - trong mot he thong thuc te
# dung co che tin tuong header reverse-proxy (xem app.py:
# try_trusted_proxy_login), proxy nay (hoac mot lop SSO/LDAP phia
# truoc no) se la noi THUC SU xac thuc nguoi dung roi gan header
# "X-Webauth-User" truoc khi forward vao app. Lab nay KHONG cai dat
# buoc xac thuc do (de don gian), nen proxy chi don gian forward moi
# request vao Flask - diem quan trong can luu y la toan bo tinh an
# toan cua co che "tin tuong header" phu thuoc vao gia dinh CHI proxy
# nay moi cham toi duoc Flask. Xem docker-compose.yml va README muc 2b
# de biet lab da VI PHAM gia dinh do nhu the nao (Flask van lo cong
# ra ngoai song song voi proxy nay).
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Day la phan LAM DUNG: moi proxy tich hop xac thuc theo header
        # deu PHAI xoa/ghi de header do tren MOI request chua duoc chinh
        # proxy tu xac thuc, de client khong the tu gan gia tri tuy y.
        # Vi proxy nay khong thuc hien buoc xac thuc nao ca (lab khong
        # mo phong SSO/LDAP thuc), no luon xoa trang header nay - nen
        # request di qua dung "cua chinh" (cong 80) se KHONG BAO GIO
        # gia mao duoc. Lo hong chi con kha thi qua con duong khac: goi
        # THANG toi Flask tren cong 5000 (xem docker-compose.yml va
        # README muc 2b).
        proxy_set_header X-Webauth-User "";
    }
}
